services:
  db:
    image: pgvector/pgvector:pg16
    container_name: legal-rag-rf-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-legal_rag}
      POSTGRES_USER: ${POSTGRES_USER:-legal_rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-legal_rag_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-legal_rag} -d $${POSTGRES_DB:-legal_rag}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
